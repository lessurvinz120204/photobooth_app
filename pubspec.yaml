name: photobooth_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.2.0 # Minimum SDK for modern Firebase/Interop

dependencies:
  flutter:
    sdk: flutter
  # Updated Firebase versions for 2026 compatibility
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
