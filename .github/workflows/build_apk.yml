name: Flutter Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the code from your repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (Required for Android builds)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Flutter (Matching your SDK)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Get dependencies (Fixes the pubspec issues)
      - name: Install dependencies
        run: flutter pub get

      # 5. Build the APK
      - name: Build APK
        run: flutter build apk --release

      # 6. Upload the APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photobooth-app-apk
          path: build/app/outputs/apk/release/app-release.apk

      # Optional: Create a release with the APK
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/apk/release/app-release.apk